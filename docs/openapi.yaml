openapi: 3.0.3

info:
  title: Automotive Marketplace API
  version: 1.0.0
  description: |
    Production-oriented REST API for an automotive marketplace.

    The API supports:
    - Vehicle listing management
    - Hierarchical categories
    - Dynamic category-specific filters
    - Full-text listing search
    - Multi-filter search
    - Cursor-based pagination
    - Soft deletion of listings

  license:
    name: Proprietary

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Health
    description: API and database health checks
  - name: Listings
    description: Vehicle listing management
  - name: Search
    description: Listing search and suggestions
  - name: Categories
    description: Hierarchical category management
  - name: Filters
    description: Dynamic filter metadata

paths:

  /health:
    get:
      tags:
        - Health
      summary: Check API health
      operationId: getHealth
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                status: true
                message: Automotive Marketplace API is running
                data:
                  service: automotive-marketplace-api
                  version: 1.0.0

  /health/db:
    get:
      tags:
        - Health
      summary: Check database health
      operationId: getDatabaseHealth
      responses:
        "200":
          description: Database connection is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                status: true
                message: Database connection is healthy
                data:
                  database: postgresql

        "503":
          description: Database connection is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: false
                message: Database connection is unavailable
                data: null

  /api/v1/listings:
    get:
      tags:
        - Listings
      summary: Browse vehicle listings
      description: |
        Returns available, pending, and sold listings.

        Removed listings are excluded.

        Pagination uses a cursor based on:
        - created_at DESC
        - id DESC

        The cursor returned by the previous request can be passed to
        the next request using the `cursor` query parameter.
      operationId: getListings
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"

        - name: category_id
          in: query
          description: Filter listings by category UUID.
          schema:
            type: string
            format: uuid

        - name: make
          in: query
          description: Filter by vehicle make.
          schema:
            type: string
            example: Toyota

        - name: model
          in: query
          description: Filter by vehicle model.
          schema:
            type: string
            example: Avanza

        - name: min_price
          in: query
          description: Minimum vehicle price.
          schema:
            type: number
            format: double
            minimum: 0
            example: 100000000

        - name: max_price
          in: query
          description: Maximum vehicle price.
          schema:
            type: number
            format: double
            minimum: 0
            example: 500000000

        - name: min_year
          in: query
          description: Minimum vehicle year.
          schema:
            type: integer
            minimum: 1900
            example: 2020

        - name: max_year
          in: query
          description: Maximum vehicle year.
          schema:
            type: integer
            minimum: 1900
            example: 2026

        - name: condition
          in: query
          description: Vehicle condition.
          schema:
            type: string
            enum:
              - new
              - used

        - name: transmission
          in: query
          description: Vehicle transmission.
          schema:
            type: string
            enum:
              - automatic
              - manual
              - cvt

        - name: fuel_type
          in: query
          description: Vehicle fuel type.
          schema:
            type: string
            enum:
              - bensin
              - diesel
              - hybrid
              - electric

        - name: color
          in: query
          description: Vehicle color.
          schema:
            type: string
            example: black

      responses:
        "200":
          description: Listings retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingListResponse"

        "422":
          $ref: "#/components/responses/ValidationError"

    post:
      tags:
        - Listings
      summary: Create a vehicle listing
      operationId: createListing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListingRequest"
            example:
              category_id: "11111111-1111-1111-1111-111111111111"
              make: Toyota
              model: Avanza
              year: 2022
              mileage: 25000
              price: 245000000
              condition: used
              transmission: automatic
              fuel_type: bensin
              color: silver
              location: Jakarta Selatan
              description: Toyota Avanza 2022 automatic condition very good
              status: available
              images:
                - image_url: https://example.com/images/avanza-1.jpg
                  sort_order: 0
                - image_url: https://example.com/images/avanza-2.jpg
                  sort_order: 1
              attributes:
                - attribute_slug: engine-capacity
                  value_number: 1500
                - attribute_slug: sunroof
                  value_boolean: false

      responses:
        "201":
          description: Listing created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingResponse"

        "404":
          $ref: "#/components/responses/NotFoundError"

        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/listings/{id}:
    get:
      tags:
        - Listings
      summary: Get a listing by ID
      operationId: getListing
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          description: Listing retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingResponse"

        "404":
          $ref: "#/components/responses/NotFoundError"

    patch:
      tags:
        - Listings
      summary: Update a vehicle listing
      operationId: updateListing
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateListingRequest"

      responses:
        "200":
          description: Listing updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingResponse"

        "404":
          $ref: "#/components/responses/NotFoundError"

        "409":
          $ref: "#/components/responses/ConflictError"

        "422":
          $ref: "#/components/responses/ValidationError"

    delete:
      tags:
        - Listings
      summary: Soft delete a listing
      description: |
        Marks the listing as `removed`.

        The listing record is retained in the database.
        Removed listings are excluded from normal listing and search results.
      operationId: deleteListing
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          description: Listing removed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                status: true
                message: Listing deleted successfully
                data: null

        "404":
          $ref: "#/components/responses/NotFoundError"

        "409":
          $ref: "#/components/responses/ConflictError"

  /api/v1/listings/search:
    get:
      tags:
        - Search
      summary: Search vehicle listings
      description: |
        Full-text and multi-filter listing search.

        Full-text search uses PostgreSQL full-text search.

        Dynamic filters can be supplied using the `filter` query parameter,
        for example:

        `filter[engine-capacity]=1500`

        `filter[sunroof]=true`

        Multiple dynamic filters are combined using AND semantics.
      operationId: searchListings
      parameters:
        - name: q
          in: query
          description: Full-text search query.
          schema:
            type: string
            example: Toyota Avanza

        - name: make
          in: query
          schema:
            type: string
            example: Toyota

        - name: model
          in: query
          schema:
            type: string
            example: Avanza

        - name: min_price
          in: query
          schema:
            type: number
            format: double
            minimum: 0
            example: 100000000

        - name: max_price
          in: query
          schema:
            type: number
            format: double
            minimum: 0
            example: 500000000

        - name: min_year
          in: query
          schema:
            type: integer
            minimum: 1900
            example: 2020

        - name: max_year
          in: query
          schema:
            type: integer
            minimum: 1900
            example: 2026

        - name: year
          in: query
          schema:
            type: integer
            minimum: 1900
            example: 2022

        - name: mileage_max
          in: query
          description: Maximum mileage.
          schema:
            type: integer
            minimum: 0
            example: 50000

        - name: condition
          in: query
          schema:
            type: string
            enum:
              - new
              - used

        - name: transmission
          in: query
          schema:
            type: string
            enum:
              - automatic
              - manual
              - cvt

        - name: fuel_type
          in: query
          schema:
            type: string
            enum:
              - bensin
              - diesel
              - hybrid
              - electric

        - name: color
          in: query
          schema:
            type: string
            example: black

        - name: category_id
          in: query
          schema:
            type: string
            format: uuid

        - name: filter[engine-capacity]
          in: query
          description: Dynamic numeric filter.
          schema:
            type: string
            example: "1500"

        - name: filter[sunroof]
          in: query
          description: Dynamic boolean filter.
          schema:
            type: string
            enum:
              - "true"
              - "false"

        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"

      responses:
        "200":
          description: Search results retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingListResponse"

        "400":
          $ref: "#/components/responses/BadRequestError"

        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/listings/search/suggest:
    get:
      tags:
        - Search
      summary: Get listing search suggestions
      description: |
        Returns make and make-model suggestions using prefix matching.
      operationId: searchListingSuggestions
      parameters:
        - name: q
          in: query
          required: true
          description: Search prefix.
          schema:
            type: string
            minLength: 1
            example: Toy

        - name: limit
          in: query
          description: Maximum number of suggestions.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
            example: 10

      responses:
        "200":
          description: Suggestions retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestionResponse"
              example:
                status: true
                message: Suggestions retrieved successfully
                data:
                  items:
                    - Toyota
                    - Toyota Avanza
                    - Toyota Fortuner
                    - Toyota Innova Reborn
                    - Toyota Rush

        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/categories:
    get:
      tags:
        - Categories
      summary: Get categories
      description: |
        Returns the hierarchical category tree.
      operationId: getCategories
      responses:
        "200":
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"

    post:
      tags:
        - Categories
      summary: Create a category
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
            example:
              parent_id: null
              name: Cars
              slug: cars
              description: Passenger cars
              is_active: true

      responses:
        "201":
          description: Category created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"

        "404":
          $ref: "#/components/responses/NotFoundError"

        "409":
          $ref: "#/components/responses/ConflictError"

        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/categories/{id}:
    get:
      tags:
        - Categories
      summary: Get a category
      operationId: getCategory
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          description: Category retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"

        "404":
          $ref: "#/components/responses/NotFoundError"

    patch:
      tags:
        - Categories
      summary: Update a category
      operationId: updateCategory
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"

      responses:
        "200":
          description: Category updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"

        "404":
          $ref: "#/components/responses/NotFoundError"

        "409":
          $ref: "#/components/responses/ConflictError"

        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/categories/{id}/listings:
    get:
      tags:
        - Categories
      summary: Get listings in a category
      description: |
        Returns listings belonging to the requested category and its
        descendant categories.
      operationId: getCategoryListings
      parameters:
        - $ref: "#/components/parameters/CategoryId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"

      responses:
        "200":
          description: Category listings retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingListResponse"

        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/filters:
    get:
      tags:
        - Filters
      summary: Get all filter definitions
      operationId: getFilters
      responses:
        "200":
          description: Filters retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilterListResponse"

  /api/v1/filters/{categoryId}:
    get:
      tags:
        - Filters
      summary: Get filters for a category
      operationId: getFiltersByCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          description: Category UUID.
          schema:
            type: string
            format: uuid

      responses:
        "200":
          description: Category filters retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilterListResponse"

        "404":
          $ref: "#/components/responses/NotFoundError"

components:

  parameters:

    ListingId:
      name: id
      in: path
      required: true
      description: Listing UUID.
      schema:
        type: string
        format: uuid

    CategoryId:
      name: id
      in: path
      required: true
      description: Category UUID.
      schema:
        type: string
        format: uuid

    Limit:
      name: limit
      in: query
      description: Number of records to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 20

    Cursor:
      name: cursor
      in: query
      description: Cursor returned by the previous paginated response.
      schema:
        type: string
        example: eyJjcmVhdGVkX2F0IjoiMjAyNi0wOS0yMy...

  responses:

    BadRequestError:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: false
            message: Invalid request
            data: null

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: false
            message: Validation failed
            data:
              errors:
                - field: price
                  message: Expected number

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: false
            message: Resource not found
            data: null

    ConflictError:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: false
            message: Resource already exists
            data: null

  schemas:

    SuccessResponse:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully
        data:
          type: object
          nullable: true

    ErrorResponse:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: boolean
          example: false
        message:
          type: string
          example: Validation failed
        data:
          type: object
          nullable: true

    Listing:
      type: object
      required:
        - id
        - category_id
        - make
        - model
        - year
        - mileage
        - price
        - condition
        - transmission
        - fuel_type
        - color
        - location
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid

        category_id:
          type: string
          format: uuid

        make:
          type: string
          example: Toyota

        model:
          type: string
          example: Avanza

        year:
          type: integer
          minimum: 1900
          example: 2022

        mileage:
          type: integer
          minimum: 0
          example: 25000

        price:
          type: number
          format: double
          minimum: 0
          example: 245000000

        condition:
          type: string
          enum:
            - new
            - used

        transmission:
          type: string
          enum:
            - automatic
            - manual
            - cvt

        fuel_type:
          type: string
          enum:
            - bensin
            - diesel
            - hybrid
            - electric

        color:
          type: string
          example: silver

        location:
          type: string
          example: Jakarta Selatan

        description:
          type: string
          nullable: true
          example: Toyota Avanza 2022 automatic condition very good

        status:
          type: string
          enum:
            - available
            - pending
            - sold
            - removed
          example: available

        images:
          type: array
          items:
            $ref: "#/components/schemas/ListingImage"

        attributes:
          type: array
          items:
            $ref: "#/components/schemas/ListingAttributeValue"

        created_at:
          type: string
          format: date-time

        updated_at:
          type: string
          format: date-time

    ListingImage:
      type: object
      required:
        - image_url
        - sort_order
      properties:
        image_url:
          type: string
          format: uri
          example: https://example.com/images/car-1.jpg

        sort_order:
          type: integer
          minimum: 0
          example: 0

    ListingAttributeValue:
      type: object
      properties:
        attribute_slug:
          type: string
          example: engine-capacity

        option_id:
          type: string
          format: uuid
          nullable: true

        value_text:
          type: string
          nullable: true

        value_number:
          type: number
          nullable: true
          example: 1500

        value_boolean:
          type: boolean
          nullable: true
          example: false

    CreateListingAttribute:
      type: object
      required:
        - attribute_slug
      properties:
        attribute_slug:
          type: string
          example: engine-capacity

        option_id:
          type: string
          format: uuid
          nullable: true

        value_text:
          type: string
          nullable: true

        value_number:
          type: number
          nullable: true
          example: 1500

        value_boolean:
          type: boolean
          nullable: true
          example: false

    CreateListingRequest:
      type: object
      required:
        - category_id
        - make
        - model
        - year
        - mileage
        - price
        - condition
        - transmission
        - fuel_type
        - color
        - location
      properties:
        category_id:
          type: string
          format: uuid

        make:
          type: string
          minLength: 1
          maxLength: 100
          example: Toyota

        model:
          type: string
          minLength: 1
          maxLength: 100
          example: Avanza

        year:
          type: integer
          minimum: 1900
          example: 2022

        mileage:
          type: integer
          minimum: 0
          example: 25000

        price:
          type: number
          minimum: 0
          example: 245000000

        condition:
          type: string
          enum:
            - new
            - used

        transmission:
          type: string
          enum:
            - automatic
            - manual
            - cvt

        fuel_type:
          type: string
          enum:
            - bensin
            - diesel
            - hybrid
            - electric

        color:
          type: string
          example: silver

        location:
          type: string
          example: Jakarta Selatan

        description:
          type: string
          nullable: true

        status:
          type: string
          enum:
            - available
            - pending
            - sold
          default: available

        images:
          type: array
          items:
            $ref: "#/components/schemas/ListingImage"

        attributes:
          type: array
          items:
            $ref: "#/components/schemas/CreateListingAttribute"

    UpdateListingRequest:
      type: object
      properties:
        category_id:
          type: string
          format: uuid

        make:
          type: string
          maxLength: 100

        model:
          type: string
          maxLength: 100

        year:
          type: integer
          minimum: 1900

        mileage:
          type: integer
          minimum: 0

        price:
          type: number
          minimum: 0

        condition:
          type: string
          enum:
            - new
            - used

        transmission:
          type: string
          enum:
            - automatic
            - manual
            - cvt

        fuel_type:
          type: string
          enum:
            - bensin
            - diesel
            - hybrid
            - electric

        color:
          type: string

        location:
          type: string

        description:
          type: string
          nullable: true

        status:
          type: string
          enum:
            - available
            - pending
            - sold

        images:
          type: array
          items:
            $ref: "#/components/schemas/ListingImage"

        attributes:
          type: array
          items:
            $ref: "#/components/schemas/CreateListingAttribute"

    Category:
      type: object
      required:
        - id
        - name
        - slug
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid

        parent_id:
          type: string
          format: uuid
          nullable: true

        name:
          type: string
          example: Cars

        slug:
          type: string
          example: cars

        description:
          type: string
          nullable: true

        is_active:
          type: boolean
          example: true

        created_at:
          type: string
          format: date-time

        updated_at:
          type: string
          format: date-time

        children:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    CreateCategoryRequest:
      type: object
      required:
        - name
        - slug
      properties:
        parent_id:
          type: string
          format: uuid
          nullable: true

        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Cars

        slug:
          type: string
          minLength: 1
          maxLength: 120
          example: cars

        description:
          type: string
          nullable: true

        is_active:
          type: boolean
          default: true

    UpdateCategoryRequest:
      type: object
      properties:
        parent_id:
          type: string
          format: uuid
          nullable: true

        name:
          type: string
          maxLength: 100

        slug:
          type: string
          maxLength: 120

        description:
          type: string
          nullable: true

        is_active:
          type: boolean

    FilterOption:
      type: object
      required:
        - id
        - value
        - label
      properties:
        id:
          type: string
          format: uuid

        value:
          type: string
          example: automatic

        label:
          type: string
          example: Automatic

        sort_order:
          type: integer
          example: 0

    FilterAttribute:
      type: object
      required:
        - id
        - category_id
        - name
        - slug
        - type
        - is_filterable
      properties:
        id:
          type: string
          format: uuid

        category_id:
          type: string
          format: uuid

        name:
          type: string
          example: Transmission

        slug:
          type: string
          example: transmission

        type:
          type: string
          enum:
            - enum
            - range
            - boolean

        is_filterable:
          type: boolean
          example: true

        options:
          type: array
