name: Sync to GitLab

on:
  push:
    branches: [ main, master ]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to GitLab
        env:
          GL_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          # 1. Konfigurasi Git agar otomatis menyertakan Token HTTP saat mengakses gitlab.com
          # Trik ini menyembunyikan token dari baris perintah URL biasa
          git config --global http.https://gitlab.com "AUTHORIZATION: basic $(echo -n "oauth2:$GL_TOKEN" | base64)"
          
          # 2. Daftarkan URL gitlab Anda secara normal dan bersih (tanpa embel-embel teks token)
          git remote add gitlab https://gitlab.com
          
          # 3. Lakukan push mirror dengan aman
          git push gitlab refs/remotes/origin/*:refs/heads/* --prune --force
