name: Sync to GitLab

on:
  push:
    branches: [main, master]

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to GitLab
        env:
          GL_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          GITLAB_URL="https://oauth2:${GL_TOKEN}@gitlab.com/andy.ami/automotive-marketplace-api.git"

          git push --prune --force "$GITLAB_URL" \
            refs/remotes/origin/*:refs/heads/*
